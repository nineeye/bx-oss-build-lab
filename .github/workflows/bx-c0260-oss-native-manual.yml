name: BX C0260 Pinned Upstream OSS Build (Manual)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type I_APPROVE_C0260_REAL_OSS_BUILD to authorize an isolated public OSS build"
        required: true
        type: string
      project:
        description: "Choose the pinned public upstream project to compile"
        required: true
        type: choice
        options:
          - ripgrep
          - godot

permissions:
  contents: read

concurrency:
  group: bx-c0260-public-${{ github.ref }}-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  native-linux:
    if: ${{ false }} # C0411 zero-cost freeze: historical workflow disabled
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GIT_TERMINAL_PROMPT: "0"
      GIT_LFS_SKIP_SMUDGE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      CARGO_TERM_COLOR: "never"
    steps:
      - name: Prepare disposable proof directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bx-c0260/out/logs" "$RUNNER_TEMP/bx-c0260/src"
      - name: Setup official Linux build prerequisites (Godot only)
        if: ${{ inputs.project == 'godot' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/bx-c0260/out/logs/00_apt_update.log"
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev 2>&1 | tee "$RUNNER_TEMP/bx-c0260/out/logs/00_build_dependencies.log"
      - name: Inspect host limits before building (informational)
        shell: bash
        run: |
          set -euo pipefail
          { uname -a; nproc; df -h .; free -h; } 2>&1 | tee "$RUNNER_TEMP/bx-c0260/out/logs/00_runner_resources.log"
      - name: Fetch pinned upstream and perform an actual build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bx-c0260"
          if [[ '${{ inputs.project }}' == ripgrep ]]; then
            git -c submodule.recurse=false clone --depth 1 --branch 14.1.1 https://github.com/BurntSushi/ripgrep.git src/ripgrep 2>&1 | tee out/logs/01_fetch.log
            expected=4649aa9700619f94cf9c66876e9549d83420e16c
            actual="$(git -C src/ripgrep rev-parse HEAD)"
            test "$actual" = "$expected"
            printf '%s\n' "$actual" > out/source_commit.txt
            rustup toolchain install 1.85.1 --profile minimal 2>&1 | tee out/logs/02_toolchain.log
            (cd src/ripgrep && cargo +1.85.1 build --release --locked) 2>&1 | tee out/logs/03_build.log
            install -m 755 src/ripgrep/target/release/rg out/rg
            out/rg --version 2>&1 | tee out/logs/04_smoke.log
            printf 'C0260_REAL_SEARCH_MATCH\n' > verify_input.txt
            out/rg -F C0260_REAL_SEARCH_MATCH verify_input.txt 2>&1 | tee out/logs/05_search.log
            test "$(out/rg -F -c C0260_REAL_SEARCH_MATCH verify_input.txt)" = 1
          else
            git -c submodule.recurse=false clone --depth 1 --branch 4.5.1-stable https://github.com/godotengine/godot.git src/godot 2>&1 | tee out/logs/01_fetch.log
            expected=f62fdbde15035c5576dad93e586201f4d41ef0cb
            actual="$(git -C src/godot rev-parse HEAD)"
            test "$actual" = "$expected"
            printf '%s\n' "$actual" > out/source_commit.txt
            PIP_CONFIG_FILE=/dev/null PIP_NO_INPUT=1 python3 -m pip download --index-url https://pypi.org/simple --no-cache-dir --only-binary=:all: --no-deps --dest . 'scons==4.9.1' 2>&1 | tee out/logs/02_download.log
            echo 'd2db1a22eb6039e97cbbb0106f18f435af033d0aad190299c9688378e2810a5e  scons-4.9.1-py3-none-any.whl' | sha256sum -c - 2>&1 | tee out/logs/03_hash.log
            python3 -m venv venv
            venv/bin/pip install --no-index --no-deps ./scons-4.9.1-py3-none-any.whl 2>&1 | tee out/logs/04_install.log
            (cd src/godot && ../../venv/bin/scons platform=linuxbsd target=template_release -j2) 2>&1 | tee out/logs/05_build.log
            mapfile -t binaries < <(find src/godot/bin -maxdepth 1 -type f -name 'godot.linuxbsd.template_release*')
            test "${#binaries[@]}" -eq 1
            install -m 755 "${binaries[0]}" out/godot
            out/godot --headless --version 2>&1 | tee out/logs/06_smoke.log
          fi
          test -s out/source_commit.txt
          test -x "out/${{ inputs.project == 'ripgrep' && 'rg' || 'godot' }}"
          file "out/${{ inputs.project == 'ripgrep' && 'rg' || 'godot' }}" | tee out/logs/07_binary_type.log
          file "out/${{ inputs.project == 'ripgrep' && 'rg' || 'godot' }}" | grep -Eq 'ELF 64-bit.*x86-64'
          (cd out && find . -type f ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          test -s out/SHA256SUMS
      - name: Save exact source/release identifiers and build provenance
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bx-c0260/out"
          printf 'controller_repo=%s\ncontroller_commit=%s\nupstream=%s\nsource_commit=%s\ngithub_run_id=%s\nrun_attempt=%s\nwindows_certified=NO\ncustomer_release=NOT_APPROVED\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" '${{ inputs.project }}' "$(cat source_commit.txt)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > BUILD_METADATA.txt
          (find . -type f ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          sha256sum -c SHA256SUMS
      - name: Upload actual binary and original logs (pass only)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bx-c0260-success-${{ inputs.project }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bx-c0260/out/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failure log separately (never mark as pass)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bx-c0260-FAILED-NOT-APPROVED-${{ inputs.project }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bx-c0260/out/logs/
          if-no-files-found: warn
          retention-days: 7
