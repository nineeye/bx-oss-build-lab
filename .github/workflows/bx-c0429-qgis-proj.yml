name: BX C0429 QGIS PROJ Windows Dependency Recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bx-c0429-qgis-proj.yml
permissions:
  contents: read
jobs:
  qgis:
    if: ${{ github.event.repository.private == false && github.repository == 'nineeye/bx-oss-build-lab' }}
    runs-on: windows-2025
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify pinned Flex Bison and vcpkg PROJ then QGIS CMake
        shell: pwsh
        timeout-minutes: 12
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PIP_NO_INPUT: '1'
        run: |
          python .github/scripts/bx-c0428-ultra10.py qgis
          if ($LASTEXITCODE -ne 0) { throw 'C0429_QGIS_PROJ_CONFIG_BLOCKED' }
