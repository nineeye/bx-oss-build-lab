name: BX C0429 Ultra Source Targeted Windows Recovery
# Official public OSS only, run on free public standard Windows runner, no BX customer code.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bx-c0429-recovery3.yml
permissions:
  contents: read
concurrency:
  group: bx-c0429-public-three
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.event.repository.private == false && github.repository == 'nineeye/bx-oss-build-lab' }}
    runs-on: windows-2025
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ultra: [obs, qgis, godot]
    steps:
      - name: Checkout public build harness only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public Windows Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Real upstream source native build and receipt
        shell: pwsh
        timeout-minutes: 13
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PIP_NO_INPUT: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python .github/scripts/bx-c0428-ultra10.py ${{ matrix.ultra }}
          if ($LASTEXITCODE -ne 0) { throw "C0429_UPSTREAM_BLOCKED_${{ matrix.ultra }}" }
