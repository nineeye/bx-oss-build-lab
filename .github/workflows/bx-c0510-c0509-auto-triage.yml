name: BX C0511 C0509 Build Completion Auto-Triage

on:
  workflow_run:
    workflows:
      - "BX C0509 LLVM 23.1.3 Upstream Stage1 (Manual)"
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/bx-c0510-c0509-auto-triage.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: bx-c0510-c0509-triage
  cancel-in-progress: false

jobs:
  syntax-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify independent parser is available and safe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/bx_ai_log_triage_c0510.py
          python3 -m unittest discover -s tools -p 'test_bx_ai_log_triage_c0510.py' -q
          python3 -m unittest discover -s tools -p 'test_bx_build_postmortem_c0511.py' -q

  after-llvm:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch C0509 log artifacts as untrusted data only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bx-c0510-input" "$RUNNER_TEMP/bx-c0510-output"
          if gh run download "$SOURCE_RUN_ID" -R "$GITHUB_REPOSITORY" \
              -D "$RUNNER_TEMP/bx-c0510-input"; then
            printf 'Found C0509 run artifacts\n'
          else
            printf 'C0509 run artifacts missing; report must explicitly say unavailable\n'
          fi
      - name: C0511 phase-aware, evidence-only diagnosis (never execute logs)
        shell: bash
        env:
          INPUT_ROOT: ${{ runner.temp }}/bx-c0510-input
          OUTPUT_ROOT: ${{ runner.temp }}/bx-c0510-output
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          python3 tools/bx_build_postmortem_c0511.py \
            --log-root "$INPUT_ROOT" --run-id "$SOURCE_RUN_ID" \
            --conclusion "$SOURCE_CONCLUSION" \
            --out "$OUTPUT_ROOT/C0511_AUTO_TRIAGE_REPORT.json"
      - name: Save only sanitized diagnostic JSON, never raw logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bx-c0511-C0509-phase-diagnostic-json-only
          path: ${{ runner.temp }}/bx-c0510-output/C0511_AUTO_TRIAGE_REPORT.json
          if-no-files-found: error
          retention-days: 3
