name: BX C0426 Public Windows Hard2 Final Diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bx-c0426-retry2-hard2.yml
permissions:
  contents: read
jobs:
  retry:
    if: ${{ github.event.repository.private == false && github.repository == 'nineeye/bx-oss-build-lab' }}
    runs-on: windows-2025
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        workload: [openshot, labelme]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Actual public upstream Windows native build
        shell: pwsh
        timeout-minutes: 24
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PIP_NO_INPUT: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          python .github/scripts/bx-c0426-public-hard10.py ${{ matrix.workload }}
          if ($LASTEXITCODE -ne 0) { throw "C0426_FINAL_DIAGNOSTIC_FAILED_${{ matrix.workload }}" }
