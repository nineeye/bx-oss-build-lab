name: BX C0350 Public Synthetic Windows EXE Order Pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bx-c0350-public-order-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-order:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Prepare pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install pinned PyInstaller
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'PyInstaller==6.16.0'
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_PYINSTALLER_FAILED' }
      - name: Build order processing EXE; run in two Korean paths twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $w = Join-Path $env:RUNNER_TEMP 'bx_c0350_pilot'
          New-Item -ItemType Directory -Path $w -Force | Out-Null
          $src = Join-Path $w 'order.py'
          $code = @'
          import csv,sys
          with open(sys.argv[1],encoding="utf-8",newline="") as inp:
              rows=list(csv.DictReader(inp))
          total=0
          with open(sys.argv[2],"w",encoding="utf-8",newline="") as out:
              wr=csv.writer(out,lineterminator="\n")
              wr.writerow(["order_id","amount"])
              for row in rows:
                  amount=int(row["qty"])*int(row["unit_price"])
                  total+=amount
                  wr.writerow([row["order_id"],amount])
              wr.writerow(["TOTAL",total])
          print(f"BX_C0350_ORDER_OK:{total}")
          '@
          [IO.File]::WriteAllText($src,$code,[Text.UTF8Encoding]::new($false))
          python -m PyInstaller --clean --noconfirm --onedir --name BX_C0350_Order --distpath "$w\dist" --workpath "$w\build" --specpath "$w\spec" "$src"
          if ($LASTEXITCODE -ne 0) { throw 'PYINSTALLER_BUILD_FAILED' }
          $built = Join-Path $w 'dist\BX_C0350_Order'
          $original = Join-Path $built 'BX_C0350_Order.exe'
          if (-not (Test-Path -LiteralPath $original)) { throw 'EXE_MISSING' }
          $exeHash = (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash.ToLowerInvariant()
          $records = @()
          foreach ($folderName in @('한글 공백 첫째','한글 공백 둘째')) {
            $dest = Join-Path $w $folderName
            Copy-Item -LiteralPath $built -Destination $dest -Recurse -Force
            $exe = Join-Path $dest 'BX_C0350_Order.exe'
            $inputFile = Join-Path $dest '발주 자료.csv'
            $csvInput = "order_id,qty,unit_price" + [char]10 + "A-001,2,3000" + [char]10 + "A-002,3,5000" + [char]10
            [IO.File]::WriteAllText($inputFile,$csvInput,[Text.UTF8Encoding]::new($false))
            $inputHash = (Get-FileHash -LiteralPath $inputFile -Algorithm SHA256).Hash.ToLowerInvariant()
            $outputHashes = @()
            foreach ($iteration in @(1,2)) {
              $outFile = Join-Path $dest "result-$iteration.csv"
              $stdout = (& $exe $inputFile $outFile | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or $stdout -cne 'BX_C0350_ORDER_OK:21000') { throw 'EXE_RUNTIME_FAILED' }
              $expected = "order_id,amount" + [char]10 + "A-001,6000" + [char]10 + "A-002,15000" + [char]10 + "TOTAL,21000" + [char]10
              if ([IO.File]::ReadAllText($outFile) -cne $expected) { throw 'BUSINESS_RESULT_MISMATCH' }
              $outputHashes += (Get-FileHash -LiteralPath $outFile -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            if ($outputHashes[0] -cne $outputHashes[1]) { throw 'REPEAT_RESULT_CHANGED' }
            if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $exeHash) { throw 'EXE_HASH_CHANGED' }
            if ((Get-FileHash -LiteralPath $inputFile -Algorithm SHA256).Hash.ToLowerInvariant() -cne $inputHash) { throw 'INPUT_MODIFIED' }
            $records += @{ runs = 2; output_sha256 = $outputHashes[0] }
          }
          $report = [ordered]@{schema='HBX_C0350_PUBLIC_SYNTHETIC_WINDOWS_PILOT_V1';state='WINDOWS_SYNTHETIC_ORDER_4_RUNS_PASS_NOT_PRODUCT';github_run_id=$env:GITHUB_RUN_ID;github_run_attempt=$env:GITHUB_RUN_ATTEMPT;github_sha=$env:GITHUB_SHA;exe_sha256=$exeHash;unicode_paths=2;runs=4;per_path=$records;product_engine_tested=$false;customer_release_approved=$false}
          $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'bx_c0350_result.json') -Encoding utf8
      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bx-c0350-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bx_c0350_result.json
          if-no-files-found: warn
          retention-days: 7
