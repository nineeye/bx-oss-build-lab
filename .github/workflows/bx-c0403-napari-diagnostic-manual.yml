name: BX C0403 Napari Source vs EXE Diagnostic (Manual)
# Public napari probe only; no private BXPRO source or customer files.
on:
  workflow_dispatch:
    inputs:
      approve:
        description: 'Type I_APPROVE_BX_C0403_NAPARI; Windows runner minutes may be charged'
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows-napari:
    if: ${{ github.actor == 'nineeye' && inputs.approve == 'I_APPROVE_BX_C0403_NAPARI' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout public controller only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.12 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install napari and PyInstaller and create public functional probe
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          PIP_NO_INPUT: '1'
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check PyInstaller==6.16.0 'napari[all]==0.9.2'
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_DEPENDENCY_INSTALL_FAIL' }
          $publicCode=@'
          import os
          os.environ.setdefault('QT_QPA_PLATFORM','offscreen')
          import numpy as np
          import napari
          viewer=napari.Viewer(show=False)
          layer=viewer.add_image(np.arange(100,dtype=np.uint8).reshape(10,10))
          assert tuple(layer.data.shape)==(10,10)
          assert int(layer.data[9,9])==99
          viewer.close()
          print('BX_NAPARI_FUNCTIONAL_PASS')
          '@
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'napari_probe.py'),$publicCode,[System.Text.UTF8Encoding]::new($false))
      - name: Run original Python functional test
        shell: pwsh
        run: |
          python .github/scripts/bx-c0403-public-runtime-probe.py --mode source --target napari_probe.py --json-out (Join-Path $env:RUNNER_TEMP 'bx-c0403-source.json') --timeout 120
          if ($LASTEXITCODE -ne 0) { throw 'NAPARI_SOURCE_FUNCTIONAL_FAIL' }
      - name: Build native Windows napari onedir EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name BX_napari --collect-all napari --collect-all vispy --collect-all magicgui --collect-all qtpy --collect-all superqt napari_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'NAPARI_EXE_BUILD_FAIL' }
      - name: Verify frozen EXE runtime, results and hash
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path (Get-Location) 'dist\BX_napari\BX_napari.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'NAPARI_EXE_NOT_FOUND' }
          $before=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          python .github/scripts/bx-c0403-public-runtime-probe.py --mode exe --target $exe --json-out (Join-Path $env:RUNNER_TEMP 'bx-c0403-exe.json') --timeout 120
          $exitCode=$LASTEXITCODE
          $after=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          $source=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'bx-c0403-source.json') -Raw | ConvertFrom-Json
          $frozen=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'bx-c0403-exe.json') -Raw | ConvertFrom-Json
          $pass=($exitCode -eq 0 -and $source.status -eq 'PASS' -and $frozen.status -eq 'PASS' -and $before -eq $after)
          $receipt=[ordered]@{schema='BX_C0403_NAPARI_WINDOWS_PUBLIC_RECEIPT';source_status=$source.status;frozen_status=$frozen.status;frozen_reason=$frozen.reason;exit_code=$frozen.exit_code;error_categories=$frozen.categories;exe_hash_before=$before;exe_hash_after=$after;public_napari_test_pass=$pass;private_bx_engine_tested=$false;full_napari_gui_certified=$false;commercial_release_approved=$false;github_run_id=$env:GITHUB_RUN_ID;github_run_attempt=$env:GITHUB_RUN_ATTEMPT}
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'bx-c0403-receipt.json') -Encoding utf8
          if (-not $pass) { throw 'NAPARI_FROZEN_RUNTIME_INCOMPLETE' }
      - name: Upload small public diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bx-c0403-public-napari-${{ github.run_id }}
          path: ${{ runner.temp }}/bx-c0403-*.json
          if-no-files-found: warn
          retention-days: 7
