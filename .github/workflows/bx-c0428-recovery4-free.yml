name: BX C0428 ULTRA10 Windows Targeted Recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bx-c0428-recovery4-free.yml
permissions:
  contents: read
jobs:
  retry:
    if: ${{ github.event.repository.private == false && github.repository == 'nineeye/bx-oss-build-lab' }}
    runs-on: windows-2025
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ultra: [godot, obs, qgis, gimp]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Retry real native Windows source build after specific error fix
        shell: pwsh
        timeout-minutes: 13
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PIP_NO_INPUT: '1'
        run: |
          python .github/scripts/bx-c0428-ultra10.py ${{ matrix.ultra }}
          if ($LASTEXITCODE -ne 0) { throw "C0428_RETRY_BLOCK_${{ matrix.ultra }}" }
