name: BX C0327 Windows 20 Independent Python Builds (Manual)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type I_APPROVE_BX_C0327_20'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bx-c0327-public-manual-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-python:
    if: ${{ github.repository == 'nineeye/bx-oss-build-lab' && inputs.approval == 'I_APPROVE_BX_C0327_20' }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - version: '6.16.0'
            label: old
          - version: '6.22.3'
            label: new
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Build all ten fixed public samples independently
        shell: pwsh
        env:
          BX_PYINSTALLER: ${{ matrix.version }}
          BX_LABEL: ${{ matrix.label }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Text.UTF8Encoding]::new($false)
          $version = $env:BX_PYINSTALLER
          $label = $env:BX_LABEL
          if ($version -cnotin @('6.16.0','6.22.3') -or $label -cnotin @('old','new')) { throw 'INVALID_MATRIX' }
          $root = Join-Path $env:RUNNER_TEMP "bx-c0327-public-$label"
          New-Item -ItemType Directory -Force $root | Out-Null
          $resultFile = Join-Path $root 'result.json'
          $samples = @(
            @{name='hello';src='print("hello-bx")';want='hello-bx'},
            @{name='json';src='import json;print(json.dumps({"a":1},sort_keys=True))';want='{"a": 1}'},
            @{name='math';src='import math;print(math.factorial(5))';want='120'},
            @{name='unicode';src='print("한글_경로_정상")';want='한글_경로_정상'},
            @{name='decimal';src='from decimal import Decimal;print(Decimal("1.25")+Decimal("2.75"))';want='4.00'},
            @{name='sqlite';src='import sqlite3;print(sqlite3.connect(":memory:").execute("select 12").fetchone()[0])';want='12'},
            @{name='regex';src='import re;print(re.sub("[0-9]+","X","abc123"))';want='abcX'},
            @{name='hash';src='import hashlib;print(hashlib.sha256(b"bx").hexdigest()[:8])';want='3ff1726c'},
            @{name='xml';src='import xml.etree.ElementTree as E;print(E.fromstring("<a>ok</a>").text)';want='ok'},
            @{name='dynamic';src='import importlib;print(importlib.import_module("statistics").mean([2,4,6]))';want='4'}
          )
          if ($samples.Count -ne 10 -or (@($samples | Select-Object -ExpandProperty name | Select-Object -Unique)).Count -ne 10) { throw 'INVALID_FIXTURE_COUNT' }
          $rows = [System.Collections.Generic.List[object]]::new()
          $installed = $false
          $py = Join-Path $root 'venv\Scripts\python.exe'
          $installCode = 'NONE'
          try {
            python -m venv (Join-Path $root 'venv')
            if ($LASTEXITCODE -ne 0) { throw 'VENV_FAILED' }
            & $py -m pip --isolated install --no-cache-dir --only-binary=:all: --index-url https://pypi.org/simple "pyinstaller==$version"
            if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAILED' }
            $actual = (& $py -c 'import importlib.metadata as m;print(m.version("pyinstaller"))').Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $version) { throw 'VERSION_MISMATCH' }
            $installed = $true
          } catch {
            $installCode = [string]$_.Exception.Message
            if ($installCode -cnotin @('VENV_FAILED','INSTALL_FAILED','VERSION_MISMATCH')) { $installCode = 'ENV_UNCLASSIFIED' }
          }
          foreach ($s in $samples) {
            $stage = 'install'; $code = 'NONE'; $state = 'SKIP'; $sourceSha = ''
            if (-not $installed) {
              $code = $installCode
            } else {
              try {
                $stage = 'prepare'
                $dir = Join-Path $root $s.name
                New-Item -ItemType Directory -Force $dir | Out-Null
                $src = Join-Path $dir 'main.py'
                [IO.File]::WriteAllText($src, $s.src + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
                $sourceSha = (Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
                $stage = 'build'
                $argsPyI = @('-m','PyInstaller','--clean','--noconfirm','--onedir','--noupx','--log-level','ERROR','--name',$s.name,'--distpath',(Join-Path $dir 'dist'),'--workpath',(Join-Path $dir 'build'),'--specpath',(Join-Path $dir 'spec'))
                if ($s.name -eq 'dynamic') { $argsPyI += @('--hidden-import','statistics') }
                $argsPyI += $src
                & $py @argsPyI
                if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAILED' }
                if ((Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sourceSha) { throw 'SOURCE_CHANGED' }
                $exe = Join-Path $dir "dist\$($s.name)\$($s.name).exe"
                if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'EXE_MISSING' }
                $bytes = [IO.File]::ReadAllBytes($exe)
                if ($bytes.Length -lt 70 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'PE_INVALID' }
                $off = [BitConverter]::ToInt32($bytes,60)
                if ($off -lt 64 -or $off -gt ($bytes.Length - 6) -or [BitConverter]::ToUInt16($bytes,$off+4) -ne 34404) { throw 'PE_INVALID' }
                $stage = 'execute'
                $psi = [Diagnostics.ProcessStartInfo]::new()
                $psi.FileName=$exe
                $psi.UseShellExecute=$false
                $psi.CreateNoWindow=$true
                $psi.RedirectStandardOutput=$true
                $psi.RedirectStandardError=$true
                $psi.StandardOutputEncoding=[Text.UTF8Encoding]::new($false,$true)
                $psi.StandardErrorEncoding=[Text.UTF8Encoding]::new($false,$true)
                $proc=[Diagnostics.Process]::new()
                try {
                  $proc.StartInfo=$psi
                  if (-not $proc.Start()) { throw 'EXEC_START_FAILED' }
                  $stdoutTask=$proc.StandardOutput.ReadToEndAsync()
                  $stderrTask=$proc.StandardError.ReadToEndAsync()
                  if (-not $proc.WaitForExit(30000)) {
                    try { $proc.Kill($true) } catch { }
                    throw 'EXEC_TIMEOUT'
                  }
                  try { $stdout=$stdoutTask.GetAwaiter().GetResult(); $null=$stderrTask.GetAwaiter().GetResult() }
                  catch { throw 'EXEC_UTF8_INVALID' }
                  if ($proc.ExitCode -ne 0) { throw 'EXEC_NONZERO_EXIT' }
                  $stdout=$stdout.Replace("`r`n","`n").TrimEnd([char[]]@("`r","`n"))
                  if ($stdout -cne $s.want) { throw 'EXEC_OUTPUT_MISMATCH' }
                } finally { $proc.Dispose() }
                if ((Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sourceSha) { throw 'SOURCE_CHANGED' }
                $state='PASS';$stage='complete'
              } catch {
                $state='FAIL'
                $code=[string]$_.Exception.Message
                if ($code -cnotin @('BUILD_FAILED','SOURCE_CHANGED','EXE_MISSING','PE_INVALID','EXEC_START_FAILED','EXEC_TIMEOUT','EXEC_UTF8_INVALID','EXEC_NONZERO_EXIT','EXEC_OUTPUT_MISMATCH')) { $code='UNCLASSIFIED_FAILURE' }
              }
            }
            $rows.Add([ordered]@{name=$s.name;status=$state;stage=$stage;code=$code;source_sha=$sourceSha})
            # Save after every case, even if a later build or output comparison fails.
            $passTotal=@($rows | Where-Object { $_.status -eq 'PASS' }).Count
            $failTotal=@($rows | Where-Object { $_.status -eq 'FAIL' }).Count
            $skipTotal=@($rows | Where-Object { $_.status -eq 'SKIP' }).Count
            $report=[ordered]@{state='PUBLIC_SYNTHETIC_PER_CASE_NOT_RELEASE';run=[string]$env:GITHUB_RUN_ID;commit=[string]$env:GITHUB_SHA;version=$version;planned=10;completed=$rows.Count;passed=$passTotal;failed=$failTotal;skipped=$skipTotal;cases=@($rows.ToArray())}
            [IO.File]::WriteAllText($resultFile,($report | ConvertTo-Json -Depth 5 -Compress),[Text.UTF8Encoding]::new($false))
            Write-Host "::notice title=BX_PUBLIC_SAMPLE::version=$version;case=$($s.name);status=$state;stage=$stage;code=$code"
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "Public synthetic-only PyInstaller $version : pass=$passTotal fail=$failTotal skip=$skipTotal (NOT customer release)"
          }
          if ($failTotal -ne 0 -or $skipTotal -ne 0 -or $passTotal -ne 10) { throw 'PUBLIC_SYNTHETIC_VERSION_INCOMPLETE_NOT_RELEASE' }
      - name: Upload compact per-version results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bx-c0327-public-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bx-c0327-public-${{ matrix.label }}/result.json
          if-no-files-found: error
          retention-days: 7
