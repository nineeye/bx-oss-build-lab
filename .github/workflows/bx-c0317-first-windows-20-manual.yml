name: BX C0317 Public Python 20 Native (Manual)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type I_APPROVE_BX_C0317_20'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bx-c0317-public-windows-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-20:
    if: ${{ github.repository == 'nineeye/bx-oss-build-lab' && inputs.approval == 'I_APPROVE_BX_C0317_20' }}
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Build and execute public fixed sample programs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          try {
            $stage = 'preflight'
            $case = 'none'
            $root = Join-Path $env:RUNNER_TEMP 'bx-c0317-public-only'
            New-Item -ItemType Directory -Force $root | Out-Null
            $samples = @(
              @{name='hello';src='print("hello-bx")';want='hello-bx'},
              @{name='json';src='import json;print(json.dumps({"a":1},sort_keys=True))';want='{"a": 1}'},
              @{name='math';src='import math;print(math.factorial(5))';want='120'},
              @{name='unicode';src='print("한글_경로_정상")';want='한글_경로_정상'},
              @{name='decimal';src='from decimal import Decimal;print(Decimal("1.25")+Decimal("2.75"))';want='4.00'},
              @{name='sqlite';src='import sqlite3;print(sqlite3.connect(":memory:").execute("select 12").fetchone()[0])';want='12'},
              @{name='regex';src='import re;print(re.sub("[0-9]+","X","abc123"))';want='abcX'},
              @{name='hash';src='import hashlib;print(hashlib.sha256(b"bx").hexdigest()[:8])';want='3ff1726c'},
              @{name='xml';src='import xml.etree.ElementTree as E;print(E.fromstring("<a>ok</a>").text)';want='ok'},
              @{name='dynamic';src='import importlib;print(importlib.import_module("statistics").mean([2,4,6]))';want='4'}
            )
            if ($samples.Count -ne 10 -or (@($samples | Select-Object -ExpandProperty name | Select-Object -Unique)).Count -ne 10) { throw 'INVALID_FIXTURE_COUNT' }
            foreach ($ver in @('6.16.0','6.22.3')) {
              $label = if ($ver -eq '6.16.0') { 'old' } else { 'new' }
              $envdir = Join-Path $root "venv-$label"
              $stage = 'venv'; $case = 'none'
              python -m venv $envdir
              if ($LASTEXITCODE -ne 0) { throw 'VENV_FAILED' }
              $py = Join-Path $envdir 'Scripts\python.exe'
              $stage = 'install'
              & $py -m pip --isolated install --no-cache-dir --only-binary=:all: --index-url https://pypi.org/simple "pyinstaller==$ver"
              if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAILED' }
              $actualVer = (& $py -c 'import importlib.metadata as m;print(m.version("pyinstaller"))').Trim()
              if ($LASTEXITCODE -ne 0 -or $actualVer -cne $ver) { throw 'PYINSTALLER_PIN_MISMATCH' }
              $rows = @()
              foreach ($s in $samples) {
                $dir = Join-Path $root "$label-$($s.name)"
                New-Item -ItemType Directory -Force $dir | Out-Null
                $src = Join-Path $dir 'main.py'
                [IO.File]::WriteAllText($src,$s.src + [Environment]::NewLine,[Text.UTF8Encoding]::new($false))
                $sourceBefore = (Get-FileHash $src -Algorithm SHA256).Hash
                $argsPyI = @('-m','PyInstaller','--clean','--noconfirm','--onedir','--noupx','--log-level','ERROR','--name',$s.name,'--distpath',(Join-Path $dir 'dist'),'--workpath',(Join-Path $dir 'build'),'--specpath',(Join-Path $dir 'spec'))
                if ($s.name -eq 'dynamic') { $argsPyI += @('--hidden-import','statistics') }
                $argsPyI += $src
                $stage = 'build'; $case = $s.name
                & $py @argsPyI
                if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAILED' }
                if ((Get-FileHash $src -Algorithm SHA256).Hash -cne $sourceBefore) { throw 'SOURCE_CHANGED_DURING_BUILD' }
                $exe = Join-Path $dir "dist\$($s.name)\$($s.name).exe"
                if (-not (Test-Path $exe)) { throw 'EXE_MISSING' }
                $bytes = [IO.File]::ReadAllBytes($exe)
                $off = [BitConverter]::ToInt32($bytes,60)
                if ($bytes[0] -ne 77 -or $bytes[1] -ne 90 -or $off -lt 64 -or $off -gt ($bytes.Length - 6) -or [BitConverter]::ToUInt16($bytes,$off+4) -ne 34404) { throw 'PE_X64_INVALID' }
                $stage = 'execute'
                $out = & $exe 2>&1
                if ($LASTEXITCODE -ne 0 -or ($out -join [Environment]::NewLine).Trim() -cne $s.want) { throw 'EXECUTION_FAILED' }
                if ((Get-FileHash $src -Algorithm SHA256).Hash -cne $sourceBefore) { throw 'SOURCE_CHANGED_DURING_EXECUTION' }
                $rows += [ordered]@{name=$s.name;source_sha=(Get-FileHash $src -Algorithm SHA256).Hash;exe_sha=(Get-FileHash $exe -Algorithm SHA256).Hash}
              }
              [ordered]@{state='SYNTHETIC_ONLY_NOT_RELEASE';version=$ver;run=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;cases=$rows} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $root "$label.json")
            }
            $stage = 'report'; $case = 'none'
            $a = Get-Content -Raw (Join-Path $root 'old.json') | ConvertFrom-Json
            $b = Get-Content -Raw (Join-Path $root 'new.json') | ConvertFrom-Json
            if ($a.cases.Count -ne 10 -or $b.cases.Count -ne 10 -or $a.run -cne $b.run -or $a.commit -cne $b.commit -or $a.run -cne $env:GITHUB_RUN_ID) { throw 'AB_MISMATCH' }
            for ($i=0;$i -lt 10;$i++) { if ($a.cases[$i].source_sha -cne $b.cases[$i].source_sha) { throw 'AB_SOURCE_MISMATCH' } }
            @{state='PUBLIC_WINDOWS_SYNTHETIC_20_PASS_NOT_RELEASE';cases=20;run=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root 'ab.json')
          } catch {
            # Only controlled reason codes / fixed fixture labels are emitted to summary.
            # Raw exception messages, source paths and customer data are not copied.
            $rawCode = [string]$_.Exception.Message
            if ($rawCode -cnotmatch '^[A-Z0-9_]{3,64}$') { $rawCode = 'UNCLASSIFIED_FAILURE' }
            if ($stage -cnotin @('preflight','venv','install','build','execute','report')) { $stage = 'unknown' }
            if ($case -cnotin @('none','hello','json','math','unicode','decimal','sqlite','regex','hash','xml','dynamic')) { $case = 'none' }
            $safe = "code=$rawCode;stage=$stage;case=$case"
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "BX synthetic Windows pilot FAILED (not a customer release): $safe"
            }
            Write-Host "::error title=BX_SYNTHETIC_WINDOWS_FAILURE::$safe"
            throw 'WINDOWS_SYNTHETIC_FAILED_NOT_RELEASE'
          }
      - name: Upload brief reports only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bx-c0317-public-synthetic-not-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bx-c0317-public-only/old.json
            ${{ runner.temp }}/bx-c0317-public-only/new.json
            ${{ runner.temp }}/bx-c0317-public-only/ab.json
          retention-days: 3
          if-no-files-found: error
